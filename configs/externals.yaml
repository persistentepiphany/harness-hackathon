# Assets the end user fetches on their own host with `pah fetch`.
# These cannot be bundled through PyPI or conda, or were not downloadable where the
# repository was built. Paths are relative to the profile's tools_dir.
# Every asset is fetched independently: a failure is recorded and the next asset proceeds.
#
# kind: http | github_release | command | manual
# default: true assets are fetched by plain `pah fetch`; others need --only <id> or --all.
version: 1
assets:
  - id: p2rank
    kind: github_release
    description: P2Rank pocket prediction (Java launcher `prank`)
    required_for: [layer2.pocket_detection]
    repo: rdk/p2rank
    asset_patterns: ['^p2rank_.*\.tar\.gz$']
    dest: opt/p2rank
    extract: tar
    links: {prank: "*/prank"}
    size_hint: ~400 MB
    source: README.md of rdk/p2rank; releases page

  - id: p2rank_source
    kind: command
    description: P2Rank built from source; runs only when the release download fails
    required_for: [layer2.pocket_detection]
    fallback_for: p2rank
    requires: [git, java]
    command: [bash, "-c", "rm -rf src && git clone --depth 1 https://github.com/rdk/p2rank src && cd src && ./gradlew --no-daemon -q assemble"]
    dest: opt/p2rank-src
    links: {prank: "src/distro/prank"}
    size_hint: ~250 MB (clone and build, needs Java 17+, Gradle and Maven Central)
    source: rdk/p2rank make.sh (./gradlew assemble)

  - id: mmseqs
    kind: http
    description: MMseqs2 static binary (sequence exposure, MSA depth)
    required_for: [layer2.msa_depth, layer3.sequence_exposure]
    url: https://mmseqs.com/latest/mmseqs-linux-avx2.tar.gz
    dest: opt/mmseqs
    extract: tar
    links: {mmseqs: "*/bin/mmseqs"}
    size_hint: ~30 MB
    source: soedinglab/MMseqs2 README.md:39

  - id: foldseek
    kind: http
    description: Foldseek static binary (structural exposure)
    required_for: [layer3.structural_exposure]
    url: https://mmseqs.com/foldseek/foldseek-linux-avx2.tar.gz
    dest: opt/foldseek
    extract: tar
    links: {foldseek: "*/bin/foldseek"}
    size_hint: ~40 MB
    source: steineggerlab/foldseek README.md:75

  - id: plinder_index
    kind: command
    description: PLINDER index tables (pocket-level exposure, calibration splits)
    required_for: [layer3.pocket_exposure]
    requires: [gcloud]
    command: [gcloud, storage, cp, -r, "gs://plinder/2024-06/v2/index", "."]
    dest: data/plinder/2024-06/v2
    instructions: Run `gcloud auth login` first. The bucket denies anonymous reads.

  - id: pinder_index
    kind: command
    description: PINDER index (protein-protein exposure)
    required_for: [layer3.interface_exposure]
    requires: [gcloud]
    command: [gcloud, storage, cp, "gs://pinder/2024-02/index.parquet", "."]
    dest: data/pinder/2024-02
    instructions: Run `gcloud auth login` first. The bucket denies anonymous reads.

  - id: gnina
    kind: github_release
    description: Gnina docking binary (executor hosts only)
    required_for: [executor.gnina]
    default: false
    repo: gnina/gnina
    asset_patterns: ['^gnina$', '^gnina[^/]*$']
    dest: opt/gnina/gnina
    executable: true
    links: {gnina: "."}
    size_hint: ~1 GB
    source: gnina/gnina docs (releases/download/<tag>/gnina)

  - id: protenix_weights
    kind: http
    description: Protenix base checkpoint (executor hosts only)
    required_for: [executor.protenix]
    default: false
    url: https://protenix.tos-cn-beijing.volces.com/checkpoint/protenix_base_default_v1.0.0.pt
    dest: weights/protenix/protenix_base_default_v1.0.0.pt
    size_hint: ~1.4 GB
    source: bytedance/Protenix protenix/web_service/dependency_url.py:17

  - id: colabfold_databases
    kind: command
    description: UniRef30 and ColabFoldDB for local MSAs (executor hosts only)
    required_for: [executor.colabfold, layer2.msa_depth]
    default: false
    requires: [bash, wget]
    command: [bash, "-c", "wget -q https://raw.githubusercontent.com/sokrypton/ColabFold/main/setup_databases.sh && bash setup_databases.sh ."]
    dest: data/colabfold
    size_hint: ~1 TB uncompressed
    instructions: Large download. Run on a storage node; see ColabFold setup_databases.sh.

  - id: alphafold3_weights
    kind: manual
    description: AlphaFold3 model parameters
    required_for: [executor.alphafold3]
    env_var: PAH_AF3_WEIGHTS
    instructions: Request access from Google DeepMind (alphafold3 repo, WEIGHTS_TERMS_OF_USE.md), then set PAH_AF3_WEIGHTS to the directory.

  - id: pydock
    kind: manual
    description: pyDock protein-protein docking
    required_for: [executor.pydock]
    env_var: PAH_PYDOCK_HOME
    instructions: Academic licence from the pyDock authors; set PAH_PYDOCK_HOME to the install path.

  - id: molprobity_data
    kind: command
    description: MolProbity reference data (Top8000 rotamer, Ramachandran and CaBLAM contours, Top8000 Rama-Z table, CCP4 and GeoStd monomer libraries) and the cctbx registration of reduce and probe
    required_for: [layer4.molprobity]
    requires: [git, curl, sha256sum, molprobity.molprobity, reduce, probe]
    dest: data/chem_data
    size_hint: ~2.3 GB (GeoStd 1.9 GB, CaBLAM contours 0.2 GB)
    source: cctbx_project libtbx/auto_build/bootstrap.py (chem_data, geostd modules); gitlab.com/phenix_project/chem_data 7b10568d; github.com/phenix-project/geostd f4d21cc5
    instructions: Needs the conda prefix from environment/conda.yml (cctbx-base, reduce, probe) on PATH or in PAH_CONDA_PREFIX.
    command:
      - bash
      - -c
      - |
        set -eu
        # MolProbity reference data and cctbx registration of reduce and probe, into the conda prefix
        # that holds cctbx-base, reduce and probe (environment/conda.yml). Run from the asset directory.
        PREFIX="${PAH_CONDA_PREFIX:-$(dirname "$(dirname "$(command -v molprobity.molprobity)")")}"
        CHEM_DATA=7b10568d6c4f0f91d35e04d3846cbf421763d792
        GEOSTD=f4d21cc5f4dbf84f55cc972fb6b287354300ab2d
        RAMA_Z=6205a5b4648b03ad2398336faddacf5633553399ce162e456bb0fbc66a55f6b6
        HERE="$(pwd)"
        rm -rf src rotarama_data cablam_data mon_lib rama_z geostd
        git init -q src
        git -C src remote add origin https://gitlab.com/phenix_project/chem_data.git
        git -C src sparse-checkout set --no-cone /rotarama_data/ /cablam_data/ /mon_lib/
        GIT_LFS_SKIP_SMUDGE=1 git -C src fetch -q --depth 1 origin "$CHEM_DATA"
        GIT_LFS_SKIP_SMUDGE=1 git -C src -c advice.detachedHead=false checkout -q FETCH_HEAD
        mv src/rotarama_data src/cablam_data src/mon_lib . && rm -rf src
        mkdir -p rama_z
        curl -fsSL -o rama_z/top8000_rama_z_dict.pkl \
          "https://gitlab.com/phenix_project/chem_data.git/gitlab-lfs/objects/$RAMA_Z"
        echo "$RAMA_Z  rama_z/top8000_rama_z_dict.pkl" | sha256sum -c -
        git init -q geostd
        git -C geostd remote add origin https://github.com/phenix-project/geostd.git
        git -C geostd fetch -q --depth 1 origin "$GEOSTD"
        git -C geostd -c advice.detachedHead=false checkout -q FETCH_HEAD
        rm -rf geostd/.git
        printf 'chem_data %s\ngeostd %s\nrama_z sha256 %s\n' "$CHEM_DATA" "$GEOSTD" "$RAMA_Z" > SOURCES.txt
        ln -sfn "$HERE" "$PREFIX/chem_data"
        "$PREFIX/bin/mmtbx.rebuild_rotarama_cache" > /dev/null
        "$PREFIX/bin/mmtbx.rebuild_cablam_cache" > /dev/null
        # cctbx calls reduce as molprobity.reduce and probe from <build>/probe/exe/probe, and only when
        # both are registered modules of the libtbx environment.
        BUILD="$PREFIX/share/cctbx"
        mkdir -p "$BUILD/probe/exe" "$BUILD/reduce/exe"
        ln -sfn "$PREFIX/bin/probe" "$BUILD/probe/exe/probe"
        ln -sfn "$PREFIX/bin/reduce" "$BUILD/reduce/exe/reduce"
        # reduce 4.15 returns 255 (ret = -1 in reduce_src/main.cpp) whenever no optimisation runs, as
        # for -trim; cctbx reads that as a crash. The wrapper maps that one code to 0.
        printf '%s\n' '#!/bin/sh' '"$(dirname "$0")/reduce" "$@"' 'rc=$?' \
          '[ "$rc" -eq 255 ] && exit 0' 'exit "$rc"' > "$PREFIX/bin/molprobity.reduce"
        chmod +x "$PREFIX/bin/molprobity.reduce"
        "$PREFIX/bin/python" -I -c '
        import libtbx.load_env, libtbx
        env = libtbx.env
        for name in ("reduce", "probe"):
            env.module_dist_paths[name] = env.as_relocatable_path(str(abs(env.build_path)) + "/" + name)
        env.pickle()
        '
        "$PREFIX/bin/molprobity.molprobity" --help 2>&1 | grep -q "Usage:"

  - id: phenix
    kind: manual
    description: Phenix (alternative MolProbity install; the default is cctbx-base from environment/conda.yml)
    required_for: [layer4.molprobity]
    default: false
    env_var: PAH_PHENIX_HOME
    instructions: Academic licence from phenix-online.org; set PAH_PHENIX_HOME and put phenix.molprobity on PATH.
